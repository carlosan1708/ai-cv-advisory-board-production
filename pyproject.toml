[project]
name = "ai-cv-advisory-board-production"
version = "0.1.0"
description = "Spec-first, production-grade AI CV advisory platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "jinja2==3.1.5",
  "pydantic-settings==2.7.1",
  "pypdf==5.1.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "playwright==1.50.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pytest-playwright==0.7.0",
  "ruff==0.9.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=src/advisory --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/advisory"]
